<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="globeGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Circular Base / Globe -->
  <circle cx="50" cy="50" r="44" fill="url(#globeGrad)" />
  <circle cx="50" cy="50" r="44" stroke="#14B8A6" stroke-width="2" stroke-opacity="0.5" />

  <!-- Globe Latitudes / Longitudes -->
  <ellipse cx="50" cy="50" rx="44" ry="20" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.2" fill="none" />
  <ellipse cx="50" cy="50" rx="20" ry="44" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.2" fill="none" />
  <line x1="6" y1="50" x2="94" y2="50" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.25" />
  <line x1="50" y1="6" x2="50" y2="94" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.25" />

  <!-- Open Book (Academic base) -->
  <path d="M26 68 C34 65, 45 65, 50 69 C55 65, 66 65, 74 68 L74 54 C66 51, 55 51, 50 55 C45 51, 34 51, 26 54 Z" 
        fill="#FFFFFF" />
  <path d="M50 55 L50 69" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" />

  <!-- Graduation Cap (Higher Education achievement) -->
  <!-- Mortarboard Diamond -->
  <polygon points="50,22 76,32 50,42 24,32" fill="url(#goldGrad)" />
  <polygon points="50,22 76,32 50,42 24,32" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.4" />
  <!-- Cap Skull Base -->
  <path d="M34 36.5 L34 46 C34 51 66 51 66 46 L66 36.5" fill="#B45309" stroke="#92400E" stroke-width="1" />
  <!-- Tassel -->
  <path d="M68 35 C70 41, 72 45, 71 49" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" fill="none" />
  <circle cx="71" cy="50" r="2" fill="#FEF08A" />

  <!-- Flight Path / International Study Trail -->
  <path d="M15 75 Q 35 15, 84 25" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4,3" stroke-linecap="round" opacity="0.85" />
  <!-- Airplane Motif at end of path -->
  <g transform="translate(84, 25) rotate(22)">
    <path d="M0 -7 L6 5 L0 3 L-6 5 Z" fill="#FFFFFF" />
  </g>
</svg>
